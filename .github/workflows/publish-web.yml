name: Publish iPhone and browser version to GitHub Pages
on:
  workflow_dispatch:
permissions:
  contents: read
  pages: write
  id-token: write
concurrency:
  group: pages
  cancel-in-progress: true
jobs:
  deploy:
    environment:
      name: github-pages
      url: ${{ steps.deploy.outputs.page_url }}
    runs-on: ubuntu-latest
    steps:
      - uses: actions/checkout@v4
      - uses: actions/configure-pages@v5
      - name: Build offline single-file edition
        run: python3 tools/build_onefile.py
      - uses: actions/upload-pages-artifact@v3
        with:
          path: web/
      - id: deploy
        uses: actions/deploy-pages@v4
