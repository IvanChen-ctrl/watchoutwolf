plugins {
    id 'com.android.application'
}
android {
    namespace 'com.moonfence.wolfmath'
    compileSdk 35
    defaultConfig {
        applicationId 'com.moonfence.wolfmath'
        minSdk 24
        targetSdk 35
        versionCode 2
        versionName '1.1.0'
    }
    compileOptions {
        sourceCompatibility JavaVersion.VERSION_17
        targetCompatibility JavaVersion.VERSION_17
    }
    buildTypes {
        release {
            minifyEnabled false
        }
    }
}
